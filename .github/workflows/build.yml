name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # Screenshot goldens are rendered locally and skipped here.
      - run: flutter test test/store_test.dart test/app_test.dart test/updater_test.dart test/motion_test.dart
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ioniq6-companion-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
